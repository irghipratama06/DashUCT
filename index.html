<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Unicity Dash</title><link rel="icon" href="logo.jpg">
<style>
:root{--o:#ff8a1f;--w:#f4f4f4}
*{box-sizing:border-box;margin:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#000;color:var(--w);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;font-weight:700;font-size:20px;pointer-events:none;z-index:2}
#mute{pointer-events:auto;background:none;border:2px solid var(--w);color:var(--w);border-radius:8px;padding:2px 10px;font-size:16px}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;padding:16px}
#ui.hide{display:none}
.p{width:min(380px,100%);max-height:92%;overflow:auto;background:rgba(0,0,0,.88);border:2px solid var(--w);padding:20px;text-align:center;box-shadow:0 0 60px rgba(255,138,31,.35)}
.p h1{font-size:30px;letter-spacing:.5px;margin:8px 0 4px}
.p p{opacity:.8;margin:6px 0 14px;font-size:15px;line-height:1.4}
.p img{width:84px;height:84px;border:2px solid var(--w)}
button.b{display:block;width:100%;margin-top:10px;padding:14px;font:700 17px inherit;font-family:inherit;border:2px solid var(--w);background:#000;color:var(--w)}
button.b.pri{background:var(--o);border-color:var(--o);color:#000}
button.b:active{transform:scale(.98)}
.msg{color:var(--o);font-size:14px;margin-top:10px;min-height:18px}
table{width:100%;border-collapse:collapse;text-align:left;font-size:15px;margin-top:8px}
td{padding:7px 4px;border-bottom:1px solid #333}td:last-child{text-align:right;font-weight:700}
tr.me td{color:var(--o)}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><span id="d">0 m</span><span id="a"></span><button id="mute">♪</button></div>
<div id="ui"><div class="p" id="panel"></div></div>
<script>
// ===== CONFIG: edit these before deploying =====
const CFG={
  TREASURY:'@YOUR_NAMETAG', // wallet that receives deposits
  COIN:'UCT', PRICE:'5', ATTEMPTS:10,
  NETWORK:'testnet2', API:'/api/leaderboard'
};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),panel=$('panel'),ui=$('ui');
const logo=new Image();logo.src='logo.jpg';
let W,H,u,gy;
function rs(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);u=Math.min(H/9,W/14);gy=H*.78}
addEventListener('resize',rs);rs();

// ===== Wallet =====
let client=null,me=null,note='';
const short=s=>s?String(s).slice(0,8)+'…'+String(s).slice(-4):'';
const key=()=>'uda_'+(me&&me.pub);
const att=()=>me?+(localStorage[key()]||0):0;
const setAtt=n=>{localStorage[key()]=Math.max(0,n)};
async function connectWallet(){
  note='Connecting…';render();startMusic();
  try{
    const {autoConnect}=await import('https://esm.sh/@unicitylabs/sphere-sdk/connect/browser');
    const {SPHERE_NETWORKS}=await import('https://esm.sh/@unicitylabs/sphere-sdk/connect');
    const r=await autoConnect({
      dapp:{name:'Unicity Dash',url:location.origin,icon:location.origin+'/logo.jpg'},
      network:SPHERE_NETWORKS[CFG.NETWORK],
      permissions:['identity:read','transfer:request'],
      walletUrl:'https://sphere.unicity.network'
    });
    client=r.client;const id=r.connection.identity;
    me={pub:id.chainPubkey||id.directAddress,label:id.nametag?'@'+id.nametag:short(id.directAddress||id.chainPubkey)};
    client.on('wallet:disconnected',()=>{me=null;client=null;note='Wallet disconnected.';render()});
    note='';
  }catch(e){note='Could not connect: '+(e&&e.message||e)}
  render();
}
async function deposit(){
  note='Confirm the payment in your wallet…';render();
  try{
    await client.intent('send',{recipient:CFG.TREASURY,amount:CFG.PRICE,coinId:CFG.COIN});
    setAtt(att()+CFG.ATTEMPTS);note='Deposit received. +'+CFG.ATTEMPTS+' attempts.';
  }catch(e){
    const c=e&&e.code;
    note=c===4003?'Payment rejected in wallet.':c===4201?'The wallet did not confirm the result. Check your wallet history before paying again.':c===4009?'Wallet is locked. Unlock it and try again.':'Payment failed: '+(e&&e.message||e);
  }
  render();
}

// ===== Leaderboard =====
async function board(){
  panel.innerHTML='<h1>Leaderboard</h1><p>Loading…</p>';
  let h='';
  try{
    const r=await fetch(CFG.API);if(!r.ok)throw 0;const rows=await r.json();
    h=rows.length?'<table>'+rows.map((x,i)=>`<tr class="${me&&x.pub===me.pub?'me':''}"><td>${i+1}</td><td>${esc(x.label)}</td><td>${x.distance} m</td></tr>`).join('')+'</table>':'<p>No runs yet. Be the first.</p>';
  }catch(e){h='<p>Leaderboard is offline. Connect a Redis database in Vercel.</p>'}
  panel.innerHTML='<h1>Leaderboard</h1>'+h+'<button class="b" onclick="render()">Back</button>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function submit(d,s){
  if(!me)return;
  fetch(CFG.API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:me.label,pub:me.pub,distance:d,seconds:s})}).catch(()=>{});
}

// ===== Panels =====
let mode='menu',last=null;
function render(){
  mode==='play'||(ui.className='');
  $('a').textContent=me?att()+' attempts':'';
  let h=`<img src="logo.jpg" alt=""><h1>${mode==='over'?last+' m':'Unicity Dash'}</h1>`;
  if(mode==='over')h+=`<p>${att()>0?att()+' attempts left.':'Out of attempts. Deposit to keep going.'}</p>`;
  else h+='<p>Tap to jump. Land on blocks, clear the spikes, run as far as you can.</p>';
  if(!me)h+='<button class="b pri" onclick="connectWallet()">Connect Sphere wallet</button>';
  else{
    h+=`<p>${esc(me.label)}</p>`;
    if(att()>0)h+=`<button class="b pri" onclick="start()">${mode==='over'?'Try again':'Play'}</button>`;
    h+=`<button class="b ${att()>0?'':'pri'}" onclick="deposit()">Deposit ${CFG.PRICE} ${CFG.COIN} for ${CFG.ATTEMPTS} attempts</button>`;
  }
  h+='<button class="b" onclick="board()">Leaderboard</button><div class="msg">'+esc(note)+'</div>';
  panel.innerHTML=h;
}

// ===== Game =====
let dist,y,vy,ground,rot,alive,obs,nx,t0,speed,best=0;
function start(){
  if(!me||att()<1)return;setAtt(att()-1);
  dist=0;y=0;vy=0;ground=true;rot=0;alive=true;obs=[];nx=15;t0=performance.now();speed=9;
  mode='play';ui.className='hide';note='';$('a').textContent=att()+' attempts left';startMusic();
}
function gen(){
  while(nx<dist+30){
    const k=Math.random()*6|0,x=nx;let len=1;
    if(k<3){for(let i=0;i<=k;i++)obs.push({t:'s',x:x+i,w:1});len=k+1}
    else if(k===3){len=1+(Math.random()*3|0);obs.push({t:'b',x,w:len})}
    else if(k===4){len=2;obs.push({t:'b',x,w:2});obs.push({t:'s',x:x+3.5,w:1});len=4.5}
    else{obs.push({t:'s',x,w:1});obs.push({t:'s',x:x+4,w:1});len=5}
    nx=x+len+8+Math.random()*4;
  }
}
function die(){
  alive=false;const d=Math.floor(dist),s=(performance.now()-t0)/1000;
  last=d;best=Math.max(best,d);submit(d,s);
  setTimeout(()=>{mode='over';render()},700);
}
let held=false;
addEventListener('pointerdown',e=>{if(mode==='play')held=true});
addEventListener('pointerup',()=>held=false);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')held=true});
addEventListener('keyup',()=>held=false);
function update(dt){
  if(!alive)return;
  speed=9+Math.min(3.5,dist/200);
  if(held&&ground){vy=19;ground=false}
  const py=y;dist+=speed*dt;vy-=60*dt;y+=vy*dt;ground=false;
  const l=dist+.15,r=dist+.85;
  for(const o of obs){
    if(o.t==='b'){
      if(r>o.x&&l<o.x+o.w){
        if(py>=.98&&y<=1){y=1;vy=0;ground=true}
        else if(y<.98){die();return}
      }
    }else if(r>o.x+.3&&l<o.x+.7&&y<.6){die();return}
  }
  if(y<=0){y=0;vy=0;ground=true}
  if(ground)rot=Math.round(rot/(Math.PI/2))*Math.PI/2;else rot+=5*dt;
  obs=obs.filter(o=>o.x+o.w>dist-5);gen();
  $('d').textContent=Math.floor(dist)+' m';
}
const px=()=>W*.22;
function draw(){
  const d=dist||0,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#000');g.addColorStop(1,'#0b0703');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W/2,H,0,W/2,H,H*.7);rg.addColorStop(0,'rgba(255,138,31,.55)');rg.addColorStop(1,'rgba(255,138,31,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  // parallax stripes echoing the logo
  ctx.fillStyle='rgba(255,255,255,.07)';
  for(let i=0;i<14;i++){const yy=(i*.53%1)*gy*.9+8,len=W*(.15+((i*37)%10)/25),sx=((i*173-d*u*.15*(1+i%3))%(W+len)+W+len)%(W+len)-len;ctx.fillRect(sx,yy,len,4)}
  // ground
  ctx.fillStyle='#000';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#f4f4f4';ctx.fillRect(0,gy,W,3);
  for(let i=1;i<5;i++){ctx.globalAlpha=.55-i*.1;ctx.fillRect(((-d*u*(1+i*.2)%W)+W)%W-W*.3,gy+i*(H-gy)/5,W*.6,3)}
  ctx.globalAlpha=1;
  if(!obs)return;
  for(const o of obs||[]){
    const x=px()+(o.x-d)*u;if(x>W+u*4||x<-u*6)continue;
    if(o.t==='b'){
      ctx.fillStyle='#000';ctx.fillRect(x,gy-u,o.w*u,u);ctx.strokeStyle='#f4f4f4';ctx.lineWidth=2;ctx.strokeRect(x+1,gy-u+1,o.w*u-2,u-2);
      ctx.fillStyle='rgba(244,244,244,.5)';for(let k=1;k<4;k++)ctx.fillRect(x+6,gy-u+k*u/4,o.w*u-12,2);
    }else{
      ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+u/2,gy-u);ctx.lineTo(x+u,gy);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    }
  }
  // player
  const cx=px()+u/2,cy=gy-y*u-u/2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  if(alive){ctx.shadowColor='#ff8a1f';ctx.shadowBlur=18}
  else ctx.globalAlpha=.4;
  ctx.drawImage(logo,-u/2,-u/2,u,u);ctx.shadowBlur=0;ctx.strokeStyle='#f4f4f4';ctx.lineWidth=2;ctx.strokeRect(-u/2,-u/2,u,u);
  ctx.restore();
}
let lt=performance.now();
(function loop(n){const dt=Math.min(.033,(n-lt)/1000);lt=n;if(mode==='play')update(dt);draw();requestAnimationFrame(loop)})(lt);

// ===== Music (WebAudio chiptune, no files needed) =====
let ac,mg,step=0,nextT=0,muted=false;
const hz=m=>440*2**((m-69)/12);
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.16)}
function sched(){
  const sp=60/140/2,roots=[33,33,29,31],arp=[0,3,7,12,7,3,10,7];
  while(nextT<ac.currentTime+.25){
    const s=step%32,root=roots[s>>3];
    tone(hz(root+(s%2?12:0)),nextT,sp*.9,'sawtooth',.22);
    if(s%4===0)kick(nextT);
    tone(hz(root+24+arp[s%8]),nextT,sp*.7,'square',.06);
    if(s%2)tone(9000,nextT,.03,'square',.015);
    nextT+=sp;step++;
  }
}
function startMusic(){
  if(ac){ac.resume();return}
  ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:.3;mg.connect(ac.destination);
  nextT=ac.currentTime+.1;setInterval(sched,50);
}
$('mute').onclick=()=>{muted=!muted;$('mute').style.opacity=muted?.4:1;if(mg)mg.gain.value=muted?0:.3};
render();
</script></body></html>
